name: CI - Billing Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/billing-service/**'
      - 'src/Shared/**'
      - '.github/workflows/ci-billing-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/billing-service/**'
      - 'src/Shared/**'

jobs:
  build-and-test:
    name: Build Billing Service
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore services/billing-service/src/BillingService/BillingService.csproj
      
      - name: Build
        run: dotnet build services/billing-service/src/BillingService/BillingService.csproj --configuration Release --no-restore
      
      - name: Run tests (if exist)
        run: |
          if [ -d "services/billing-service/tests" ]; then
            dotnet test services/billing-service/tests --configuration Release --no-build --verbosity normal
          else
            echo "No tests found, skipping..."
          fi
        continue-on-error: true
      
      - name: Build Docker image (validation only)
        run: docker build -t billing-service:ci -f services/billing-service/Dockerfile services/billing-service
