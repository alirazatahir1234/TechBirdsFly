            --port=8080

      # Output service URLs
      - name: Get Service URLs
        run: |
          echo "=== Deployed Service URLs ===" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Frontend: $(gcloud run services describe techbirdsfly-frontend --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
          echo "Gateway: $(gcloud run services describe techbirdsfly-gateway --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
          echo "Auth Service: $(gcloud run services describe techbirdsfly-auth --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
          echo "Admin Service: $(gcloud run services describe techbirdsfly-admin --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
          echo "Billing Service: $(gcloud run services describe techbirdsfly-billing --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
          echo "Cache Service: $(gcloud run services describe techbirdsfly-cache --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
          echo "Editor Service: $(gcloud run services describe techbirdsfly-editor --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
          echo "Export Service: $(gcloud run services describe techbirdsfly-export --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
          echo "Media Service: $(gcloud run services describe techbirdsfly-media --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
          echo "Project Service: $(gcloud run services describe techbirdsfly-project --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
          echo "Publish Service: $(gcloud run services describe techbirdsfly-publish --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
          echo "Template Service: $(gcloud run services describe techbirdsfly-template --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
          echo "User Service: $(gcloud run services describe techbirdsfly-user --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
          echo "Generator Service: $(gcloud run services describe techbirdsfly-generator --region=${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_STEP_SUMMARY
