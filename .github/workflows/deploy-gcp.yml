          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/admin-service:latest
          
      # Build and Push Billing Service
      - name: Build Billing Service
        run: |
          docker build \
