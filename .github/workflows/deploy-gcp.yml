            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --port=8080 \
            --set-env-vars="ASPNETCORE_ENVIRONMENT=Production"
            
      - name: Deploy Billing Service to Cloud Run
        run: |
          gcloud run deploy techbirdsfly-billing \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/billing-service:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --port=8080 \
            --set-env-vars="ASPNETCORE_ENVIRONMENT=Production"
            
      - name: Deploy Cache Service to Cloud Run
        run: |
          gcloud run deploy techbirdsfly-cache \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/cache-service:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --port=8080 \
            --set-env-vars="ASPNETCORE_ENVIRONMENT=Production"
            
      - name: Deploy Editor Service to Cloud Run
