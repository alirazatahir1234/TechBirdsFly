name: CI - Gateway

on:
  push:
    branches: [main, develop]
    paths:
      - 'gateway/yarp-gateway/**'
      - 'src/Shared/**'
      - '.github/workflows/ci-gateway.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'gateway/yarp-gateway/**'
      - 'src/Shared/**'

jobs:
  build-and-test:
    name: Build Gateway
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore gateway/yarp-gateway/src/YarpGateway.csproj
      
      - name: Build
        run: dotnet build gateway/yarp-gateway/src/YarpGateway.csproj --configuration Release --no-restore
      
      - name: Run tests (if exist)
        run: |
          if [ -d "gateway/yarp-gateway/tests" ]; then
            dotnet test gateway/yarp-gateway/tests --configuration Release --no-build --verbosity normal
          else
            echo "No tests found, skipping..."
          fi
        continue-on-error: true
      
      - name: Build Docker image (validation only)
        run: docker build -t yarp-gateway:ci -f gateway/yarp-gateway/Dockerfile gateway/yarp-gateway
