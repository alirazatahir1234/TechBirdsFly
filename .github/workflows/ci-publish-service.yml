name: CI - Publish Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/publish-service/**'
      - 'src/Shared/**'
      - '.github/workflows/ci-publish-service.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/publish-service/**'
      - 'src/Shared/**'

jobs:
  build-and-test:
    name: Build Publish Service
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore services/publish-service/src/WebAPI/PublishService.WebAPI.csproj
      
      - name: Build
        run: dotnet build services/publish-service/src/WebAPI/PublishService.WebAPI.csproj --configuration Release --no-restore
      
      - name: Run tests (if exist)
        run: |
          if [ -d "services/publish-service/tests" ]; then
            dotnet test services/publish-service/tests --configuration Release --no-build --verbosity normal
          else
            echo "No tests found, skipping..."
          fi
        continue-on-error: true
      
      - name: Build Docker image (validation only)
        run: docker build -t publish-service:ci -f services/publish-service/Dockerfile services/publish-service
