<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- White Background -->
  <rect x="0" y="0" width="256" height="256" fill="white" rx="40"/>
  
  <!-- Shadow/Border for definition -->
  <rect x="0" y="0" width="256" height="256" fill="none" stroke="#E5E5E5" stroke-width="2" rx="40"/>
  
  <!-- Bird Icon -->
  <g transform="translate(128, 128) scale(2.5)">
    <!-- Wing Top -->
    <path d="M -20 -10 Q -15 -15 -5 -12 Q 0 -11 5 -8 Q 0 -14 -8 -16 Q -15 -18 -20 -12 Z" fill="#6B2FD9"/>
    
    <!-- Wing Middle -->
    <path d="M -20 0 Q -10 -5 5 -2 Q 10 -1 14 3 Q 10 -3 0 -5 Q -10 -7 -20 -2 Z" fill="#6B2FD9"/>
    
    <!-- Wing Bottom -->
    <path d="M -18 10 Q -8 5 8 8 Q 14 9 18 14 Q 14 8 4 6 Q -8 3 -18 8 Z" fill="#6B2FD9"/>
    
    <!-- Bird Body -->
    <ellipse cx="10" cy="0" rx="9" ry="12" fill="#6B2FD9"/>
    
    <!-- Bird Head -->
    <circle cx="22" cy="-8" r="6" fill="#6B2FD9"/>
    
    <!-- Eye White -->
    <circle cx="26" cy="-9" r="1.5" fill="white"/>
    
    <!-- Beak -->
    <path d="M 28 -8 L 34 -9 L 28 -6 Z" fill="#6B2FD9"/>
    
    <!-- Tech Circuit Lines -->
    <g stroke="white" stroke-width="1" fill="none" stroke-linecap="round">
      <path d="M 12 -5 L 12 10"/>
      <path d="M 18 -7 L 18 10"/>
      <path d="M 12 0 L 18 0"/>
      <path d="M 12 5 L 18 5"/>
      
      <circle cx="12" cy="-5" r="1" fill="white"/>
      <circle cx="12" cy="0" r="1" fill="white"/>
      <circle cx="12" cy="5" r="1" fill="white"/>
      <circle cx="12" cy="10" r="1" fill="white"/>
      
      <circle cx="18" cy="-7" r="1" fill="white"/>
      <circle cx="18" cy="0" r="1" fill="white"/>
      <circle cx="18" cy="5" r="1" fill="white"/>
      <circle cx="18" cy="10" r="1" fill="white"/>
    </g>
  </g>
</svg>
