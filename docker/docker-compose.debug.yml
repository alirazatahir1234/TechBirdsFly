version: '3.9'

# ============================================================================
# DEBUG DOCKER COMPOSE - Local Development with Hot Reload
# ============================================================================
# Usage:
#   docker compose -f docker-compose.debug.yml up -d
#   docker compose -f docker-compose.debug.yml logs -f
#   docker compose -f docker-compose.debug.yml down
# ============================================================================

services:
  # ============================================================================
  # INFRASTRUCTURE
  # ============================================================================

  postgres:
    image: postgres:17-alpine
    container_name: techbirdsfly-postgres-debug
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data_debug:/var/lib/postgresql/data
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "com.techbirdsfly.service=postgres"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: techbirdsfly-zookeeper-debug
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: "WARN"
    ports:
      - "2181:2181"
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.techbirdsfly.service=zookeeper"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: techbirdsfly-kafka-debug
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG4J_ROOT_LOGLEVEL: "WARN"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 30s
    volumes:
      - kafka_data_debug:/var/lib/kafka/data
    labels:
      - "com.techbirdsfly.service=kafka"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: techbirdsfly-schema-registry-debug
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:29092"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: "WARN"
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.techbirdsfly.service=schema-registry"

  # ============================================================================
  # OBSERVABILITY
  # ============================================================================

  seq:
    image: datalust/seq:2024.1
    container_name: techbirdsfly-seq-debug
    restart: unless-stopped
    ports:
      - "5341:5341"
      - "8080:80"
    environment:
      - ACCEPT_EULA=Y
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5341/api/diagnostics", "||", "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "com.techbirdsfly.service=seq"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: techbirdsfly-jaeger-debug
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "6831:6831/udp"  # Jaeger agent
      - "6832:6832/udp"
      - "5775:5775/udp"
      - "5778:5778"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:16686/", "||", "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "com.techbirdsfly.service=jaeger"

  redis:
    image: redis:7.4-alpine
    container_name: techbirdsfly-redis-debug
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_debug:/data
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      - "com.techbirdsfly.service=redis"

  mongodb:
    image: mongo:7.0
    container_name: techbirdsfly-mongo-debug
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_debug:/data/db
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.techbirdsfly.service=mongodb"

  # ============================================================================
  # MICROSERVICES - .NET
  # ============================================================================

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: src/WebAPI/Dockerfile
    container_name: techbirdsfly-auth-service-debug
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "5001:5001"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      Kafka:BootstrapServers: kafka:29092
      Kafka:SchemaRegistry:Url: http://schema-registry:8081
      ConnectionStrings:DefaultConnection: "Host=postgres;Port=5432;Database=techbirdsfly_auth;Username=postgres;Password=postgres123"
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.techbirdsfly.service=auth-service"

  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    container_name: techbirdsfly-user-service-debug
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "5008:5008"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5008
      Kafka:BootstrapServers: kafka:29092
      Kafka:SchemaRegistry:Url: http://schema-registry:8081
      ConnectionStrings:DefaultConnection: "Host=postgres;Port=5432;Database=techbirdsfly_users;Username=postgres;Password=postgres123"
      EventBusUrl: http://event-bus-service:5020
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5008/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.techbirdsfly.service=user-service"

  billing-service:
    build:
      context: ../services/billing-service
      dockerfile: Dockerfile
    container_name: techbirdsfly-billing-service-debug
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "5002:5002"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5002
      Kafka:BootstrapServers: kafka:29092
      Kafka:SchemaRegistry:Url: http://schema-registry:8081
      ConnectionStrings:DefaultConnection: "Host=postgres;Port=5432;Database=techbirdsfly_billing;Username=postgres;Password=postgres123"
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.techbirdsfly.service=billing-service"

  event-bus-service:
    build:
      context: ../services/event-bus-service
      dockerfile: Dockerfile
    container_name: techbirdsfly-event-bus-service-debug
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "5020:5020"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5020
      Kafka:BootstrapServers: kafka:29092
      Kafka:SchemaRegistry:Url: http://schema-registry:8081
      ConnectionStrings:DefaultConnection: "Host=postgres;Port=5432;Database=techbirdsfly_eventbus;Username=postgres;Password=postgres123"
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5020/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.techbirdsfly.service=event-bus-service"

  generator-service:
    build:
      context: ../services/generator-service
      dockerfile: Dockerfile
    container_name: techbirdsfly-generator-service-debug
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "5003:5003"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5003
      Kafka:BootstrapServers: kafka:29092
      Kafka:SchemaRegistry:Url: http://schema-registry:8081
      ConnectionStrings:DefaultConnection: "Host=postgres;Port=5432;Database=techbirdsfly_generator;Username=postgres;Password=postgres123"
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.techbirdsfly.service=generator-service"

  admin-service:
    build:
      context: ../services/admin-service
      dockerfile: Dockerfile
    container_name: techbirdsfly-admin-service-debug
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "5006:5006"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5006
      Kafka:BootstrapServers: kafka:29092
      Kafka:SchemaRegistry:Url: http://schema-registry:8081
      ConnectionStrings:DefaultConnection: "Host=postgres;Port=5432;Database=techbirdsfly_admin;Username=postgres;Password=postgres123"
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.techbirdsfly.service=admin-service"

  image-service:
    build:
      context: ../services/image-service
      dockerfile: Dockerfile
    container_name: techbirdsfly-image-service-debug
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "5007:5007"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5007
      Kafka:BootstrapServers: kafka:29092
      Kafka:SchemaRegistry:Url: http://schema-registry:8081
      ConnectionStrings:DefaultConnection: "Host=postgres;Port=5432;Database=techbirdsfly_images;Username=postgres;Password=postgres123"
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5007/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.techbirdsfly.service=image-service"

  export-service:
    build:
      context: ../services/export-service
      dockerfile: Dockerfile
    container_name: techbirdsfly-export-service-debug
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "5004:5004"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5004
      Kafka:BootstrapServers: kafka:29092
      Kafka:SchemaRegistry:Url: http://schema-registry:8081
      ConnectionStrings:DefaultConnection: "Host=postgres;Port=5432;Database=techbirdsfly_export;Username=postgres;Password=postgres123"
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.techbirdsfly.service=export-service"

  project-service:
    build:
      context: ../services/ProjectService
      dockerfile: Dockerfile
    container_name: techbirdsfly-project-service-debug
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "5009:5009"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5009
      Kafka:BootstrapServers: kafka:29092
      Kafka:SchemaRegistry:Url: http://schema-registry:8081
      ConnectionStrings:DefaultConnection: "Host=postgres;Port=5432;Database=techbirdsfly_projects;Username=postgres;Password=postgres123"
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5009/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.techbirdsfly.service=project-service"

  cache-service:
    build:
      context: ../services/cache-service
      dockerfile: Dockerfile
    container_name: techbirdsfly-cache-service-debug
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "5021:5021"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5021
      Redis:Host: redis
      Redis:Port: "6379"
      ConnectionStrings:DefaultConnection: "Host=postgres;Port=5432;Database=techbirdsfly_cache;Username=postgres;Password=postgres123"
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5021/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.techbirdsfly.service=cache-service"

  media-service:
    build:
      context: ../services/media-service
      dockerfile: Dockerfile
    container_name: techbirdsfly-media-service-debug
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5022:5022"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5022
      ConnectionStrings:DefaultConnection: "Host=postgres;Port=5432;Database=techbirdsfly_media;Username=postgres;Password=postgres123"
      MongoDB:ConnectionString: "mongodb://mongodb:27017"
      MongoDB:Database: techbirdsfly_media
      Redis:Host: redis
      Redis:Port: "6379"
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5022/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.techbirdsfly.service=media-service"

  # ============================================================================
  # GATEWAY
  # ============================================================================

  api-gateway:
    build:
      context: ../gateway/yarp-gateway
      dockerfile: Dockerfile
    container_name: techbirdsfly-api-gateway-debug
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      event-bus-service:
        condition: service_healthy
      generator-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      image-service:
        condition: service_healthy
      export-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      cache-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:9000
      Logging:LogLevel:Default: Information
      Services:AuthService: http://auth-service:5001
      Services:UserService: http://user-service:5008
      Services:BillingService: http://billing-service:5002
      Services:EventBusService: http://event-bus-service:5020
      Services:GeneratorService: http://generator-service:5003
      Services:AdminService: http://admin-service:5006
      Services:ImageService: http://image-service:5007
      Services:ExportService: http://export-service:5004
      Services:ProjectService: http://project-service:5009
      Services:CacheService: http://cache-service:5021
      Services:MediaService: http://media-service:5022
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "com.techbirdsfly.service=api-gateway"

  # ============================================================================
  # FRONTEND
  # ============================================================================

  frontend:
    build:
      context: ../web-frontend/techbirdsfly-frontend-nextjs
      dockerfile: Dockerfile
    container_name: techbirdsfly-frontend-debug
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://api-gateway:9000
      NEXT_PUBLIC_AUTH_URL: http://auth-service:5001
      NEXT_PUBLIC_API_BASE_URL: http://localhost:9000
    networks:
      - techbirdsfly_debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "com.techbirdsfly.service=frontend"

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  postgres_data_debug:
    driver: local
  kafka_data_debug:
    driver: local
  redis_data_debug:
    driver: local
  mongo_data_debug:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  techbirdsfly_debug:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
